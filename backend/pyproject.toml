[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joe Dracup", email = "joe@dracup.me.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.128.8",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "websockets>=17.3",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.alembic]
script_location = "%(here)s/migrations"
# Date-prefixed migration file names, so they sort in the order they were created.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
