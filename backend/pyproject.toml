[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joe Dracup", email = "joe@dracup.me.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.128.8",
    "geoalchemy2>=0.21.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "websockets>=17.3",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F), plus import sorting, modern-syntax upgrades, likely bugs,
# and importing another module's _private names. Listed in full because preview mode
# changes what the defaults are.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PLC2701"]
# PLC2701 is a preview rule; only turn on the preview rules named above.
preview = true
explicit-preview-rules = true

[tool.alembic]
script_location = "%(here)s/migrations"
# Date-prefixed migration file names, so they sort in the order they were created.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

# Lint and format each newly generated migration, so autogenerated files pass ruff too.
[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
